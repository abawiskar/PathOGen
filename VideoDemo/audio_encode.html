<!doctype html>
<meta charset="utf-8">
<title>audio encode</title>
<body>
<script>
// AAC-LC encode of an interleaved stereo float32 file with WebCodecs. make_audio.py pulls the chunks and muxes them.
window.encodeAudio = async (url, sampleRate = 48000, bitrate = 160000) => {
  const pcm = new Float32Array(await (await fetch(url, { cache: 'no-store' })).arrayBuffer());
  const frames = pcm.length / 2;
  const cfg = { codec: 'mp4a.40.2', sampleRate, numberOfChannels: 2, bitrate };
  if (!(await AudioEncoder.isConfigSupported(cfg)).supported) throw new Error('AAC not supported');
  const chunks = []; let desc = null, err = null;
  const enc = new AudioEncoder({
    output: (ch, md) => { if (md && md.decoderConfig && md.decoderConfig.description) desc = new Uint8Array(md.decoderConfig.description.slice ? md.decoderConfig.description.slice(0) : md.decoderConfig.description);
      const d = new Uint8Array(ch.byteLength); ch.copyTo(d); chunks.push({ ts: ch.timestamp, d }); },
    error: e => { err = e; } });
  enc.configure(cfg);
  const N = 4800;
  for (let o = 0; o < frames; o += N) {
    if (err) throw err;
    const n = Math.min(N, frames - o), plan = new Float32Array(n * 2);
    for (let i = 0; i < n; i++) { plan[i] = pcm[(o + i) * 2]; plan[n + i] = pcm[(o + i) * 2 + 1]; }
    const ad = new AudioData({ format: 'f32-planar', sampleRate, numberOfFrames: n, numberOfChannels: 2, timestamp: Math.round(o * 1e6 / sampleRate), data: plan });
    enc.encode(ad); ad.close();
    while (enc.encodeQueueSize > 16) await new Promise(r => setTimeout(r, 1));
  }
  await enc.flush(); enc.close();
  if (err) throw err;
  const size = chunks.reduce((a, c) => a + c.d.length, 0);
  const all = new Uint8Array(size); let o = 0; for (const c of chunks) { all.set(c.d, o); o += c.d.length; }
  window.__all = all;
  return { n: chunks.length, sizes: chunks.map(c => c.d.length), ts0: chunks.length ? chunks[0].ts : 0, desc: Array.from(desc || []), size };
};
window.chunk = (i, n) => {
  const buf = window.__all.subarray(i, i + n);
  let s = ''; for (let k = 0; k < buf.length; k += 0x8000) s += String.fromCharCode.apply(null, buf.subarray(k, k + 0x8000));
  return btoa(s);
};
</script>
